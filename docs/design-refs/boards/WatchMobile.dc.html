<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>FLUTCH 시청 모바일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0C0F}
a{color:#F3F5F7;text-decoration:none}
.ch12{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.ch6{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.texture{background:#0A0C0F url(../brand/bg-speed.jpg) center/cover}
</style>
</helmet>
<div style="width:390px;height:1100px;overflow:hidden;background:#0A0C0F;color:#F3F5F7;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column">
  <div class="texture" style="aspect-ratio:16/9;position:relative;display:flex;align-items:center;justify-content:center">
    <div style="position:absolute;inset:0;background:rgba(10,12,15,.3)"></div>
    <a href="#" aria-label="뒤로" style="position:absolute;top:4px;left:4px;width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3F5F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <span style="position:absolute;top:14px;left:48px;background:#FF2E4D;color:#fff;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:11px;padding:2px 7px">LIVE</span>
    <span style="position:relative;font-family:'Chakra Petch',sans-serif;font-size:13px;color:#A3AAB6">화면 공유 영상</span>
    <div class="ch6" style="position:absolute;right:8px;bottom:8px;width:26%;aspect-ratio:16/9;background:#191D25;box-shadow:0 0 0 1px rgba(176,246,18,.5);font-size:10px;color:#A3AAB6;display:flex;align-items:center;justify-content:center">웹캠</div>
    <button type="button" class="ch6" style="position:absolute;left:8px;bottom:8px;height:32px;padding:0 10px;border:0;background:rgba(10,12,15,.8);color:#F3F5F7;font-size:12px;font-family:'Noto Sans KR',sans-serif">소리 켜기</button>
  </div>

  <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:#12151B;border-bottom:1px solid rgba(176,246,18,.25)">
    <img src="../brand/logo-clutch-time.png" alt="CLUTCH TIME" style="height:26px">
    <div class="ch6" style="flex:1;height:10px;background:#191D25"><div class="ch6" style="width:72%;height:100%;background:#B0F612"></div></div>
    <b style="font-family:'JetBrains Mono',monospace;font-size:13px">72%</b>
    <button type="button" class="ch6" aria-label="클러치" style="height:44px;width:52px;border:0;background:#B0F612;color:#0A0C0F;display:inline-flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4l2.5-6 4 12 3-9 2 3H22"></path></svg></button>
    <button type="button" class="ch6" aria-label="SUPER BURST" style="height:44px;width:44px;border:0;background:#FFC21A;color:#0A0C0F;display:inline-flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></button>
  </div>

  <div style="display:flex;align-items:center;gap:10px;padding:12px">
    <img src="../brand/face-excited.png" alt="" style="width:36px;height:36px;border-radius:50%;box-shadow:0 0 0 2px #4DA3FF">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
      <b style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">[대회 준비중] 오늘도 클러치 가보자!</b>
      <span style="font-size:12px;color:#A3AAB6">김플러 · FPS · <span style="font-family:'JetBrains Mono',monospace;color:#FF2E4D">32,481</span></span>
    </div>
    <button type="button" class="ch6" style="height:40px;padding:0 12px;border:0;background:#B0F612;color:#0A0C0F;font-weight:700;font-size:13px;font-family:'Noto Sans KR',sans-serif">후원</button>
  </div>

  <div role="tablist" style="display:flex;border-bottom:1px solid #191D25">
    <button type="button" role="tab" aria-selected="true" style="flex:1;height:44px;border:0;border-bottom:2px solid #B0F612;background:transparent;color:#F3F5F7;font-weight:700;font-size:14px;font-family:'Noto Sans KR',sans-serif">채팅</button>
    <button type="button" role="tab" aria-selected="false" style="flex:1;height:44px;border:0;background:transparent;color:#A3AAB6;font-size:14px;font-family:'Noto Sans KR',sans-serif">후원 128,400</button>
  </div>

  <div style="flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5;overflow:hidden">
    <div><span style="font-size:10px;font-weight:700;padding:1px 4px;background:#B0F612;color:#0A0C0F">스트리머</span> <b style="color:#4DA3FF">김플러</b> 다들 오늘도 와줘서 고마워요!</div>
    <div><b style="color:#2EE6D6">에임장인</b> ㄷㄷ 방금 그거 실화냐</div>
    <div><span style="font-size:10px;font-weight:700;padding:1px 4px;background:#FFC21A;color:#0A0C0F">후원자</span> <b style="color:#9B7BFF">밤샘냥</b> 와 미쳤다 ㄷㄷ</div>
    <div style="background:rgba(255,194,26,.1);padding:8px 10px"><b style="color:#FFC21A">익명의 후원자</b> 10,000 Beats · 대회 화이팅!!</div>
    <div><b style="color:#5CF2A0">수다곰</b> 클러치각이다!</div>
    <div style="color:#7C8494;font-style:italic"><b>모닝톡</b> 삭제된 메시지입니다</div>
    <div><b style="color:#E8ECF1">라라</b> 이번 판 이기면 대회 간다 <span style="font-size:11px;color:#7C8494">(수정됨)</span></div>
  </div>

  <div style="padding:10px 12px 20px;border-top:1px solid #191D25">
    <label class="ch6" style="display:flex;align-items:center;gap:8px;background:#191D25;padding:0 12px;height:44px">
      <input type="text" aria-label="채팅 입력" placeholder="채팅 입력" style="flex:1;min-width:0;background:transparent;border:0;outline:0;color:#F3F5F7;font-size:14px;font-family:'Noto Sans KR',sans-serif">
      <button type="button" aria-label="보내기" style="width:36px;height:36px;border:0;background:transparent;color:#B0F612"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7z"></path></svg></button>
    </label>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
