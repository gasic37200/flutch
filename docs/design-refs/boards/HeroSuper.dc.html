<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>FLUTCH 히어로 SUPER CLUTCH</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0C0F}
a{color:#F3F5F7;text-decoration:none}
.ch12{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.ch6{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.texture{background:#0A0C0F url(../brand/bg-speed.jpg) center/cover}
</style>
</helmet>
<div style="width:1440px;height:1100px;box-sizing:border-box;padding:40px 48px;background:#0A0C0F;color:#F3F5F7;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;gap:20px">
  <span style="font-size:13px;color:#A3AAB6">홈 히어로 · 진행 중인 SUPER CLUTCH를 30초씩 회전 (발동 후 5분간)</span>

  <div style="display:flex;gap:16px">
    <div style="flex:1 1 auto;min-width:0;filter:drop-shadow(0 0 16px rgba(255,122,26,.45))"><div class="ch12" style="background:linear-gradient(135deg,#FF2BD6,#FF7A1A,#FFE11A);padding:2px"><div class="ch12" style="background:#12151B;display:flex;flex-direction:column">
      <div class="texture" style="aspect-ratio:16/9;position:relative;display:flex;align-items:center;justify-content:center">
        <div style="position:absolute;inset:0;background:rgba(10,12,15,.3)"></div>
        <span style="position:absolute;top:16px;left:16px;display:inline-flex;align-items:center;gap:6px;background:#FF2E4D;color:#fff;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px;padding:4px 10px"><span style="width:6px;height:6px;border-radius:50%;background:#fff"></span>LIVE</span>
        <span style="position:absolute;top:16px;left:96px;font-family:'Chakra Petch',sans-serif;font-style:italic;font-weight:700;font-size:14px;padding:4px 12px;background:linear-gradient(90deg,#FF2BD6,#FF7A1A,#FFE11A);color:#0A0C0F;letter-spacing:.04em">SUPER CLUTCH</span>
        <span style="position:relative;font-family:'Chakra Petch',sans-serif;font-size:15px;color:#A3AAB6">라이브 영상 · 음소거 자동재생</span>
        <div style="position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(25,29,37,.8)"><div style="width:64%;height:100%;background:linear-gradient(90deg,#FF2BD6,#FF7A1A,#FFE11A)"></div></div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;padding:16px 18px">
        <img src="../brand/face-joy.png" alt="" style="width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 2px #9B7BFF">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><b style="font-size:17px">버추얼_릴리</b><span style="font-size:15px">[버추얼] 신규 3D 모델 첫 공개</span></div>
        <b style="font-family:'JetBrains Mono',monospace;color:#FF2E4D;font-size:15px">18,240명</b>
      </div>
    </div></div></div>

    <div style="flex:0 0 340px;filter:drop-shadow(0 0 16px rgba(255,122,26,.45))"><div class="ch12" style="height:100%;background:linear-gradient(135deg,#FF2BD6,#FF7A1A,#FFE11A);padding:2px;box-sizing:border-box"><div class="ch12" style="height:100%;background:#12151B;padding:22px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:center">
      <img src="../brand/logo-super-clutch.png" alt="SUPER CLUTCH" style="width:100%;max-width:280px">
      <div style="width:100%;display:flex;justify-content:space-between;font-size:13px;color:#A3AAB6"><span>다음 방송까지</span><b style="font-family:'JetBrains Mono',monospace;color:#F3F5F7;font-size:16px">0:18</b></div>
      <div class="ch6" style="width:100%;height:10px;background:#191D25"><div class="ch6" style="width:64%;height:100%;background:linear-gradient(90deg,#FF2BD6,#FF7A1A,#FFE11A)"></div></div>
      <a href="#" class="ch6" style="width:100%;height:46px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#FF2BD6,#FF7A1A,#FFE11A);color:#0A0C0F;font-weight:700;font-size:15px">지금 보러 가기</a>
      <div style="width:100%;height:1px;background:#191D25"></div>
      <span style="align-self:flex-start;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;color:#A3AAB6">진행 중인 SUPER CLUTCH · 4</span>
      <div style="width:100%;display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{queue}}" as="q" hint-placeholder-count="3">
          <a href="#" style="display:flex;align-items:center;gap:10px;font-size:14px"><b style="font-family:'JetBrains Mono',monospace;color:#7C8494;width:16px">{{q.n}}</b><img src="{{q.face}}" alt="" style="width:28px;height:28px;border-radius:50%"><span style="flex:1">{{q.name}}</span><span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#A3AAB6">{{q.eta}}</span></a>
        </sc-for>
      </div>
    </div></div></div>
  </div>

  <span style="font-size:13px;color:#A3AAB6;margin-top:12px">모바일 히어로 · SUPER CLUTCH</span>
  <div style="width:390px;display:flex;flex-direction:column;background:#0A0C0F;box-shadow:0 0 0 1px #191D25">
    <div class="texture" style="aspect-ratio:16/9;position:relative;display:flex;align-items:center;justify-content:center"><div style="position:absolute;inset:0;background:rgba(10,12,15,.3)"></div><span style="position:absolute;top:10px;left:10px;font-family:'Chakra Petch',sans-serif;font-style:italic;font-weight:700;font-size:12px;padding:3px 8px;background:linear-gradient(90deg,#FF2BD6,#FF7A1A,#FFE11A);color:#0A0C0F">SUPER CLUTCH</span><span style="position:relative;font-size:12px;color:#A3AAB6">라이브 영상</span><div style="position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(25,29,37,.8)"><div style="width:64%;height:100%;background:linear-gradient(90deg,#FF2BD6,#FF7A1A,#FFE11A)"></div></div></div>
    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px"><img src="../brand/logo-super-clutch.png" alt="SUPER CLUTCH" style="width:90px"><div style="flex:1;display:flex;flex-direction:column;gap:2px"><b style="font-size:14px">버추얼_릴리</b><span style="font-size:12px;color:#A3AAB6"><b style="font-family:'JetBrains Mono',monospace;color:#F3F5F7">0:18</b> 뒤 박클러치 · 진행 중 4</span></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return { queue: [
      { n: '▶', name: '버추얼_릴리 (지금)', eta: '3:40 남음', face: '../brand/face-joy.png' },
      { n: '1', name: '박클러치 · 방금 발동', eta: '4:58 남음', face: '../brand/face-grumpy.png' },
      { n: '2', name: '밤샘냥', eta: '2:05 남음', face: '../brand/face-calm.png' },
      { n: '3', name: '수다곰', eta: '0:41 남음', face: '../brand/face-happy.png' }
    ] };
  }
}
</script>
</body>
</html>
