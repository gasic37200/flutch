<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>FLUTCH 탐색</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0C0F}
a{color:#F3F5F7;text-decoration:none}a:hover{color:#D4FF6A}
.ch12{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.ch6{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.texture{background:#0A0C0F url(/_blob/3d8747c0d27ead1c50b2d826552c3c41) center/cover}
.ex-app{container-type:inline-size;container-name:ex}
.ex-inner{max-width:1600px;margin:0 auto;box-sizing:border-box;padding:28px 32px 56px;display:flex;flex-direction:column;gap:36px}
.ex-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ex-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px 16px}
.ex-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
.card .thumbframe,.cat .thumbframe{background:rgba(176,246,18,.25)}
.card .thumbframe{background:transparent}
.card:hover .thumbframe,.cat:hover .thumbframe{background:#B0F612;filter:drop-shadow(0 0 12px rgba(176,246,18,.45))}
.card:hover .cardtitle{color:#D4FF6A}
@container ex (max-width:900px){ .ex-split{grid-template-columns:minmax(0,1fr)} }
@container ex (max-width:600px){
  .ex-inner{padding:16px 16px 40px;gap:28px}
  .ex-cats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ex-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
  .ex-cards .ex-tags{display:none!important}
  .ex-streamers{flex-wrap:nowrap!important;overflow-x:auto;margin:0 -16px;padding:0 16px}
  .ex-vod-thumb{width:120px!important;flex-basis:120px!important}
  .ex-title{font-size:22px!important}
}
</style>
</helmet>
<div class="ex-app" style="width:100%;background:#0A0C0F;color:#F3F5F7;font-family:'Noto Sans KR',sans-serif">
<div class="ex-inner">

  <div style="display:flex;flex-direction:column;gap:12px">
    <h1 class="ex-title" style="margin:0;font-size:26px;font-weight:900">탐색</h1>
    <label class="ch6" style="max-width:640px;height:48px;background:#12151B;box-shadow:inset 0 0 0 1px #B0F612,0 0 0 3px rgba(176,246,18,.2);display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;box-sizing:border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0F612" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input type="search" aria-label="검색" value="랭크" style="flex:1;min-width:0;background:transparent;border:0;outline:0;color:#F3F5F7;font-size:15px;font-family:'Noto Sans KR',sans-serif">
      <button type="button" aria-label="검색어 지우기" style="width:40px;height:40px;border:0;background:transparent;color:#A3AAB6"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </label>
    <span style="font-size:13px;color:#7C8494">제목·스트리머 닉네임·태그에서 찾아요</span>
  </div>

  <section style="display:flex;flex-direction:column;gap:14px">
    <h2 style="margin:0;font-size:18px;font-weight:900">카테고리</h2>
    <div class="ex-cats">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <a href="#" class="cat" aria-pressed="{{c.on}}" style="display:block">
          <div class="ch12 thumbframe" style="background:{{c.frame}};padding:1px"><div class="ch12 texture" style="aspect-ratio:4/3;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box">
            <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,15,.3),rgba(10,12,15,.88))"></div>
            <b style="position:relative;font-size:16px">{{c.name}}</b>
            <span style="position:relative;font-size:12px;color:#A3AAB6">라이브 <b style="font-family:'JetBrains Mono',monospace;color:#FF2E4D">{{c.live}}</b></span>
          </div></div>
        </a>
      </sc-for>
    </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:baseline;gap:10px"><h2 style="margin:0;font-size:18px;font-weight:900">"랭크" 라이브</h2><span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#A3AAB6">12</span></div>
    <div class="ex-cards">
      <sc-for list="{{lives}}" as="l" hint-placeholder-count="4">
        <a href="#" class="card" style="display:flex;flex-direction:column;gap:10px;min-width:0">
          <div class="ch12 thumbframe" style="padding:1px"><div class="texture ch12" style="aspect-ratio:16/9;position:relative">
            <span style="position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:5px;background:#FF2E4D;color:#fff;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:11px;padding:2px 6px;letter-spacing:.06em"><span style="width:5px;height:5px;border-radius:50%;background:#fff"></span>LIVE</span>
            <span style="position:absolute;left:8px;bottom:8px;background:rgba(10,12,15,.85);color:#FF2E4D;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;padding:2px 6px">{{l.viewers}}</span>
          </div></div>
          <div style="display:flex;gap:10px;min-width:0">
            <img src="{{l.face}}" alt="" style="width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 2px {{l.ring}};flex:none">
            <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
              <b class="cardtitle" style="font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{l.title}}</b>
              <span style="font-size:12px;color:#A3AAB6">{{l.name}}</span>
              <span class="ex-tags" style="display:flex;gap:6px;margin-top:2px"><span class="ch6" style="font-size:11px;padding:2px 7px;background:#191D25;color:#A3AAB6">{{l.cat}}</span><span class="ch6" style="font-size:11px;padding:2px 7px;background:rgba(176,246,18,.12);color:#B0F612">{{l.tag}}</span></span>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
  </section>

  <div class="ex-split">
    <section style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <h2 style="margin:0;font-size:18px;font-weight:900">스트리머</h2>
      <div class="ex-streamers" style="display:flex;gap:20px;flex-wrap:wrap">
        <sc-for list="{{streamers}}" as="s" hint-placeholder-count="3">
          <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;flex:none">
            <img src="{{s.face}}" alt="" style="width:72px;height:72px;border-radius:50%;box-shadow:0 0 0 3px {{s.ring}}">
            <b style="font-size:14px">{{s.name}}</b>
            <span style="font-size:12px;color:{{s.stColor}}">{{s.status}}</span>
          </a>
        </sc-for>
      </div>
    </section>
    <section style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <h2 style="margin:0;font-size:18px;font-weight:900">다시보기</h2>
      <sc-for list="{{vods}}" as="v" hint-placeholder-count="2">
        <a href="#" class="card" style="display:flex;gap:12px;align-items:center;min-width:0">
          <div class="ch6 texture ex-vod-thumb" style="width:150px;flex:0 0 150px;aspect-ratio:16/9;position:relative"><span style="position:absolute;right:6px;bottom:6px;background:rgba(10,12,15,.85);font-family:'JetBrains Mono',monospace;font-size:11px;padding:1px 5px">{{v.len}}</span></div>
          <div style="min-width:0;display:flex;flex-direction:column;gap:4px"><b class="cardtitle" style="font-size:14px">{{v.title}}</b><span style="font-size:12px;color:#A3AAB6">{{v.meta}}</span></div>
        </a>
      </sc-for>
    </section>
  </div>

  <section style="display:flex;flex-direction:column;gap:10px">
    <span style="font-size:12px;color:#7C8494">검색 결과가 없을 때</span>
    <div class="ch12" style="background:rgba(176,246,18,.25);padding:1px;max-width:640px"><div class="ch12" style="background:#12151B;padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
      <img src="/_blob/ec28e7006ea21f7dc6c0e45b683602df" alt="" style="height:88px;width:auto;object-fit:contain">
      <b style="font-size:15px">"ㅁㄴㅇ" 결과가 없어요</b>
      <span style="font-size:13px;color:#A3AAB6">다른 검색어나 카테고리로 찾아보세요</span>
      <span class="ch6" style="background:#B0F612;padding:1px;display:inline-flex"><a href="#" class="ch6" style="height:38px;padding:0 17px;display:inline-flex;align-items:center;background:#12151B;color:#B0F612;font-weight:700;font-size:14px">전체 카테고리 보기</a></span>
    </div></div>
  </section>
</div>
</div>
</x-dc>

</body>
</html>
