<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>FLUTCH 회원가입</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0C0F}
a{color:#B0F612}a:hover{color:#D4FF6A}
.ch12{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.ch6{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.texture{background:#0A0C0F url(../brand/bg-speed.jpg) center/cover}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap;background:#0A0C0F;color:#F3F5F7;font-family:'Noto Sans KR',sans-serif">
  <section class="texture" style="flex:1 1 420px;min-height:360px;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:48px;box-sizing:border-box">
    <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,12,15,.2),rgba(10,12,15,.8))"></div>
    <img src="../brand/logo-flutch.png" alt="FLUTCH" style="position:relative;height:44px;align-self:flex-start">
    <div style="position:relative;display:flex;align-items:center;gap:16px"><img src="../brand/face-joy.png" alt="" style="width:88px;height:88px;border-radius:50%"><span style="font-size:24px;font-weight:900;line-height:1.35">가입하면 바로<br>방송하고 응원할 수 있어요.</span></div>
  </section>

  <section style="flex:1 1 480px;display:flex;justify-content:center;padding:48px 24px;box-sizing:border-box">
    <form style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px">
      <h1 style="margin:0;font-size:26px;font-weight:900">회원가입</h1>

      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A3AAB6">아이디
        <input type="text" value="clutchking" autocomplete="username" class="ch6" style="height:48px;border:0;background:#12151B;box-shadow:inset 0 0 0 1px #B0F612;color:#F3F5F7;padding:0 14px;font-size:15px;font-family:'Noto Sans KR',sans-serif">
        <span style="font-size:12px;color:#B0F612">사용할 수 있는 아이디예요 · 4~20자 영문 소문자·숫자, 나중에 바꿀 수 없어요</span>
      </label>

      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A3AAB6">비밀번호
        <input type="password" value="abcd1234" autocomplete="new-password" class="ch6" style="height:48px;border:0;background:#12151B;box-shadow:inset 0 0 0 1px rgba(176,246,18,.25);color:#F3F5F7;padding:0 14px;font-size:15px;font-family:'Noto Sans KR',sans-serif">
        <span style="display:flex;gap:12px;font-size:12px"><span style="color:#B0F612">✓ 8자 이상</span><span style="color:#B0F612">✓ 영문 + 숫자</span><span style="color:#B0F612">✓ 아이디와 다름</span></span>
      </label>

      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A3AAB6">닉네임
        <input type="text" value="운영자" class="ch6" style="height:48px;border:0;background:#12151B;box-shadow:inset 0 0 0 1px #F3F5F7;color:#F3F5F7;padding:0 14px;font-size:15px;font-family:'Noto Sans KR',sans-serif" aria-invalid="true">
        <span style="font-size:12px;color:#F3F5F7;display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B0F612" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>사용할 수 없는 닉네임이에요 · 2~12자 한글·영문·숫자, 바꾸면 30일 뒤에 다시 바꿀 수 있어요</span>
      </label>

      <div class="ch12" style="background:rgba(176,246,18,.25);padding:1px"><div class="ch12" style="background:#12151B;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px">
        <label style="display:flex;align-items:center;gap:8px;font-weight:700"><input type="checkbox" checked="" style="width:18px;height:18px;accent-color:#B0F612">전체 동의</label>
        <div style="height:1px;background:#191D25"></div>
        <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" checked="" style="width:18px;height:18px;accent-color:#B0F612">[필수] 이용약관 동의<a href="#" style="margin-left:auto;font-size:13px">보기</a></label>
        <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" checked="" style="width:18px;height:18px;accent-color:#B0F612">[필수] 개인정보처리방침 동의<a href="#" style="margin-left:auto;font-size:13px">보기</a></label>
        <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" checked="" style="width:18px;height:18px;accent-color:#B0F612">[필수] 만 14세 이상이에요</label>
      </div></div>

      <button type="button" class="ch6" disabled="" style="height:50px;border:0;background:#262B35;color:#7C8494;font-weight:700;font-size:16px;font-family:'Noto Sans KR',sans-serif">가입하기</button>
      <p style="margin:0;font-size:13px;color:#A3AAB6">이미 계정이 있나요? <a href="#">로그인</a> · 본인 확인 없이 바로 가입돼요. 비밀번호를 잊으면 복구할 수 없어요.</p>
    </form>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
