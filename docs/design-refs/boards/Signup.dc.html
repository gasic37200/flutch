<style>

a{color:#B0F612}a:hover{color:#D4FF6A}

/* same composition as the login board */
.ac-app{container-type:inline-size;container-name:ac;position:relative;background:#0A0C0F url(/_blob/3d8747c0d27ead1c50b2d826552c3c41) center/cover}

.ac-card-in{padding:32px}
.ac-in{height:48px;border:0;background:#12151B;box-shadow:inset 0 0 0 1px rgba(176,246,18,.25);color:#F3F5F7;padding:0 14px;font-size:15px;font-family:'Noto Sans KR',sans-serif}
@container ac (max-width:600px){.ac-col{padding:28px 16px 40px;gap:18px;justify-content:flex-start;min-height:0}.ac-card-in{padding:20px}.ac-brand img{height:32px!important}.ac-brand span{font-size:13px!important}.ac-title{font-size:22px!important}}

<div class="ac-app" style="width:100%;color:#F3F5F7;font-family:'Noto Sans KR',sans-serif">
  <div class="ac-shade"></div>
  <div class="ac-col">

      <span style="font-family:'Chakra Petch',sans-serif;font-style:italic;font-weight:700;color:#B0F612;letter-spacing:.04em;font-size:15px">Feel the Moment. Live on FLUTCH.</span>
    </div>

    <div class="ch12" style="width:100%;max-width:480px;background:rgba(176,246,18,.25);padding:1px;filter:drop-shadow(0 0 24px rgba(176,246,18,.12))"><form class="ch12 ac-card-in" style="margin:0;background:rgba(18,21,27,.94);display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;flex-direction:column;gap:4px"><h1 class="ac-title" style="margin:0;font-size:26px;font-weight:900">회원가입</h1><span style="font-size:13px;color:#A3AAB6">가입하면 바로 방송하고 응원할 수 있어요.</span></div>

      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A3AAB6">아이디
        <input type="text" value="clutchking" autocomplete="username" class="ch6 ac-in" style="box-shadow:inset 0 0 0 1px #B0F612">
        <span style="font-size:12px;color:#B0F612">사용할 수 있는 아이디예요 · 4~20자 영문 소문자·숫자, 나중에 바꿀 수 없어요</span>
      </label>

      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A3AAB6">비밀번호
        <input type="password" value="abcd1234" autocomplete="new-password" class="ch6 ac-in">
        <span style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px"><span style="color:#B0F612">✓ 8자 이상</span><span style="color:#B0F612">✓ 영문 + 숫자</span><span style="color:#B0F612">✓ 아이디와 다름</span></span>
      </label>

      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A3AAB6">닉네임
        <input type="text" value="운영자" class="ch6 ac-in" style="box-shadow:inset 0 0 0 1px #F3F5F7" aria-invalid="true">
        <span style="font-size:12px;color:#F3F5F7;display:flex;align-items:flex-start;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F3F5F7" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>사용할 수 없는 닉네임이에요 · 2~12자 한글·영문·숫자, 바꾸면 30일 뒤에 다시 바꿀 수 있어요</span>
      </label>

      <div class="ch6" style="background:#191D25;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px">
        <label style="display:flex;align-items:center;gap:8px;font-weight:700"><input type="checkbox" checked="" style="width:18px;height:18px;accent-color:#B0F612">전체 동의</label>
        <div style="height:1px;background:#262B35"></div>
        <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" checked="" style="width:18px;height:18px;accent-color:#B0F612">[필수] 이용약관 동의<a href="#" style="margin-left:auto;font-size:13px">보기</a></label>
        <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" checked="" style="width:18px;height:18px;accent-color:#B0F612">[필수] 개인정보처리방침 동의<a href="#" style="margin-left:auto;font-size:13px">보기</a></label>
        <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" checked="" style="width:18px;height:18px;accent-color:#B0F612">[필수] 만 14세 이상이에요</label>
      </div>

      <button type="button" class="ch6" disabled="" style="height:50px;border:0;background:#262B35;color:#7C8494;font-weight:700;font-size:16px;font-family:'Noto Sans KR',sans-serif">가입하기</button>
      <p style="margin:0;font-size:13px;color:#A3AAB6;text-align:center">이미 계정이 있나요? <a href="#">로그인</a></p>
      <p style="margin:0;font-size:12px;color:#7C8494;text-align:center">본인 확인 없이 바로 가입돼요. 비밀번호를 잊으면 복구할 수 없어요.</p>
    </form></div>
  </div>
</div>
