<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>FLUTCH 홈 모바일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0C0F}
a{color:#F3F5F7;text-decoration:none}
.ch12{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.ch6{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.texture{background:#0A0C0F url(../brand/bg-speed.jpg) center/cover}
</style>
</helmet>
<div style="width:390px;height:1880px;overflow:hidden;background:#0A0C0F;color:#F3F5F7;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column">

  <header style="height:56px;display:flex;align-items:center;gap:4px;padding:0 8px 0 4px;border-bottom:1px solid #191D25">
    <button type="button" aria-label="메뉴 열기" style="width:44px;height:44px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3F5F7" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <img src="../brand/logo-flutch.png" alt="FLUTCH" style="height:24px">
    <span style="flex:1"></span>
    <button type="button" aria-label="검색" style="width:44px;height:44px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F5F7" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
    <a href="#" aria-label="방송하기" style="width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3F5F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"></rect><path d="m16 10 6-3v10l-6-3"></path></svg></a>
    <button type="button" aria-label="내 메뉴 (잔액 3,500 비트)" style="width:44px;height:44px;border:0;padding:0;background:transparent;display:inline-flex;align-items:center;justify-content:center"><img src="../brand/face-happy.png" alt="" style="width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 2px #B0F612"></button>
  </header>

  <section aria-label="메인 라이브" style="display:flex;flex-direction:column">
    <div class="texture" style="aspect-ratio:16/9;position:relative;display:flex;align-items:center;justify-content:center">
      <div style="position:absolute;inset:0;background:rgba(10,12,15,.35)"></div>
      <span style="position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:5px;background:#FF2E4D;color:#fff;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:12px;padding:3px 8px"><span style="width:5px;height:5px;border-radius:50%;background:#fff"></span>LIVE</span>
      <span style="position:relative;font-family:'Chakra Petch',sans-serif;font-size:13px;color:#A3AAB6">라이브 영상 영역</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px">
      <img src="../brand/face-excited.png" alt="" style="width:36px;height:36px;border-radius:50%;box-shadow:0 0 0 2px #4DA3FF">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">[대회 준비중] 오늘도 클러치 가보자!</span>
        <span style="font-size:12px;color:#A3AAB6">김플러 · FPS</span>
      </div>
      <b style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#FF2E4D">32,481</b>
    </div>
    <a href="#" class="ch12" style="margin:0 16px;background:#B0F612;padding:1px;display:block">
      <div class="ch12" style="background:#12151B;display:flex;align-items:center;gap:12px;padding:12px 14px">
        <img src="../brand/logo-clutch-time.png" alt="CLUTCH TIME" style="width:88px;object-fit:contain">
        <div style="flex:1;display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;align-items:center;gap:8px"><div class="ch6" style="flex:1;height:10px;background:#191D25"><div class="ch6" style="width:72%;height:100%;background:#B0F612"></div></div><b style="font-family:'JetBrains Mono',monospace;font-size:14px">72%</b></div>
          <span style="font-size:13px;font-weight:700">지금, 클러치할 시간!</span>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B0F612" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </div>
    </a>
  </section>

  <section style="padding:24px 0 0;display:flex;flex-direction:column;gap:12px">
    <h2 style="margin:0 16px;font-size:17px;font-weight:900">추천 라이브 채널</h2>
    <div style="display:flex;gap:12px;overflow-x:auto;padding:0 16px">
      <sc-for list="{{recommended}}" as="r" hint-placeholder-count="3">
        <a href="#" style="flex:0 0 220px;display:flex;flex-direction:column;gap:8px">
          <div class="texture ch12" style="aspect-ratio:16/9;position:relative"><span style="position:absolute;top:6px;left:6px;background:#FF2E4D;color:#fff;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:11px;padding:2px 6px">LIVE</span><span style="position:absolute;top:6px;right:6px;background:rgba(10,12,15,.8);font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 6px">{{r.viewers}}</span></div>
          <b style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.title}}</b>
          <span style="font-size:12px;color:#A3AAB6">{{r.name}} · {{r.cat}}</span>
        </a>
      </sc-for>
    </div>
  </section>

  <section style="padding:28px 0 0;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:8px;margin:0 16px">
      <h2 style="margin:0;font-family:'Chakra Petch',sans-serif;font-style:italic;font-size:18px;font-weight:700">CLUTCH FEED</h2>
      <svg width="56" height="16" viewBox="0 0 72 20" fill="none" stroke="#B0F612" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M0 10h24l5-7 6 14 5-9 4 2h28"></path></svg>
      <a href="#" style="margin-left:auto;font-size:13px;color:#A3AAB6">더보기</a>
    </div>
    <div style="display:flex;gap:12px;overflow-x:auto;padding:0 16px">
      <sc-for list="{{feed}}" as="f" hint-placeholder-count="4">
        <a href="#" style="flex:0 0 160px;display:flex;flex-direction:column;gap:8px">
          <div class="texture ch12" style="aspect-ratio:9/12;position:relative;display:flex;align-items:center;justify-content:center"><span style="position:absolute;top:6px;left:6px;background:rgba(10,12,15,.8);font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 5px">0:45</span><span style="width:36px;height:36px;border-radius:50%;background:rgba(10,12,15,.75);display:inline-flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#F3F5F7" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span></div>
          <b style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{f.title}}</b>
        </a>
      </sc-for>
    </div>
  </section>

  <section style="padding:28px 16px 0;display:flex;flex-direction:column;gap:12px">
    <h2 style="margin:0;font-size:17px;font-weight:900">지금 두근거리는 중!</h2>
    <div role="group" aria-label="카테고리" style="display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="9">
        <button type="button" class="ch6" aria-pressed="{{c.on}}" style="flex:0 0 auto;height:36px;padding:0 14px;border:0;background:{{c.bg}};color:{{c.fg}};font-weight:{{c.w}};font-size:13px;font-family:'Noto Sans KR',sans-serif">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <sc-for list="{{lives}}" as="l" hint-placeholder-count="6">
        <a href="#" style="display:flex;flex-direction:column;gap:6px">
          <div class="texture ch12" style="aspect-ratio:16/9;position:relative"><span style="position:absolute;top:6px;left:6px;background:#FF2E4D;color:#fff;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:10px;padding:2px 5px">LIVE</span><span style="position:absolute;left:6px;bottom:6px;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:11px">{{l.cat}}</span><span style="position:absolute;right:6px;bottom:6px;font-family:'JetBrains Mono',monospace;font-size:11px">{{l.viewers}}</span></div>
          <b style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{l.title}}</b>
          <span style="font-size:12px;color:#A3AAB6">{{l.name}}</span>
        </a>
      </sc-for>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1880}}'>
class Component extends DCLogic {
  renderVals() {
    var catNames = ['전체', '저스트채팅', '종합게임', 'FPS', 'RPG', '공포게임', '버추얼', '스포츠', '음악'];
    return {
      recommended: [
        { name: '버추얼_릴리', title: '[버추얼] 신규 3D 모델 첫 공개', cat: '버추얼', viewers: '1.8만' },
        { name: '박클러치', title: '[프로팀 내전] 레전드 매치', cat: 'FPS', viewers: '9.7천' },
        { name: '밤샘냥', title: '새벽 공포게임 같이 할 사람?', cat: '공포게임', viewers: '4.1천' }
      ],
      feed: [
        { title: '이게 3대1을 이기네 ㄷㄷ' }, { title: '버추얼 최초 시각화 도네!' },
        { title: '방종 직전 역대급 뇌절' }, { title: '플러치 오픈 기념 눈물 ㅠㅠ' }
      ],
      cats: catNames.map(function (n, i) { return { label: n, on: i === 0 ? 'true' : 'false', bg: i === 0 ? '#B0F612' : '#191D25', fg: i === 0 ? '#0A0C0F' : '#A3AAB6', w: i === 0 ? 700 : 500 }; }),
      lives: [
        { title: '잔잔바리 종겜 수다방', cat: '종합게임', viewers: '3,412', name: '수다곰' },
        { title: '신작 공포게임 같이 볼 사람?', cat: '공포게임', viewers: '1,894', name: '밤샘냥' },
        { title: '[버추얼] 3D 아바타 최초공개!', cat: '버추얼', viewers: '5,110', name: '버추얼_릴리' },
        { title: '배틀로얄 랭크 구함!', cat: 'FPS', viewers: '821', name: '에임장인' },
        { title: '오늘은 노래 부르는 날', cat: '음악', viewers: '2,207', name: '라라' },
        { title: '레이드 공략 같이 뚫어요', cat: 'RPG', viewers: '1,355', name: '용사킴' }
      ]
    };
  }
}
</script>
</body>
</html>
