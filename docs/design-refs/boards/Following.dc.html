<style>
body{margin:0;background:#0A0C0F}
a{color:#F3F5F7;text-decoration:none}a:hover{color:#D4FF6A}

.pu-app{container-type:inline-size;container-name:pu}
.pu-inner{max-width:1600px;margin:0 auto;box-sizing:border-box;padding:28px 32px 56px;display:flex;flex-direction:column;gap:32px}
.pu-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px 16px}

.card:hover .cardtitle{color:#D4FF6A}
@container pu (max-width:600px){

  .pu-cards{grid-template-columns:minmax(0,1fr)}
  .pu-head h1{font-size:24px!important}
  .pu-row{flex-wrap:wrap}
