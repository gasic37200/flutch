<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>FLUTCH 내 지갑</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0C0F}
a{color:#B0F612}
.ch12{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.ch6{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.dots{background-image:radial-gradient(rgba(176,246,18,.45) 1px,transparent 1.5px);background-size:6px 6px}
</style>
</helmet>
<div style="min-height:100vh;background:#0A0C0F;color:#F3F5F7;font-family:'Noto Sans KR',sans-serif">
  <div style="max-width:1200px;margin:0 auto;padding:32px 24px 48px;display:flex;flex-wrap:wrap;gap:28px;box-sizing:border-box">

    <main style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px">
      <h1 style="margin:0;font-size:26px;font-weight:900">내 지갑</h1>

      <div style="filter:drop-shadow(0 0 12px rgba(176,246,18,.35))"><div class="ch12" style="background:#B0F612;padding:1px"><div class="ch12" style="background:#12151B;padding:24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden">
        <div class="dots" style="position:absolute;right:0;top:0;width:180px;height:100px;opacity:.6"></div>
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#B0F612" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:relative"><path d="M2 12h4l2.5-6 4 12 3-9 2 3H22"></path></svg>
        <div style="position:relative;display:flex;flex-direction:column;gap:4px;flex:1">
          <span style="font-size:14px;color:#A3AAB6">보유 비트</span>
          <span><b style="font-family:'JetBrains Mono',monospace;font-size:40px">3,500</b> <span style="font-family:'Chakra Petch',sans-serif;font-weight:700;color:#B0F612;font-size:20px">Beats</span></span>
          <span style="font-size:12px;color:#7C8494">1 Beat = 1원 · 보유 한도 3,000,000</span>
        </div>
        <button type="button" class="ch6" style="position:relative;height:50px;padding:0 26px;border:0;background:#B0F612;color:#0A0C0F;font-weight:700;font-size:16px;font-family:'Noto Sans KR',sans-serif">충전하기</button>
      </div></div></div>

      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <h2 style="margin:0;font-size:18px;font-weight:900;margin-right:auto">사용 내역</h2>
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button type="button" class="ch6" aria-pressed="{{f.on}}" style="height:34px;padding:0 12px;border:0;background:{{f.bg}};color:{{f.fg}};font-size:13px;font-weight:{{f.w}};font-family:'Noto Sans KR',sans-serif">{{f.label}}</button>
        </sc-for>
        <select class="ch6" aria-label="월" style="height:34px;border:0;background:#191D25;color:#F3F5F7;padding:0 10px;font-size:13px;font-family:'Noto Sans KR',sans-serif"><option>2026년 11월</option></select>
      </div>

      <div class="ch12" style="background:rgba(176,246,18,.25);padding:1px"><div class="ch12" style="background:#12151B;display:flex;flex-direction:column">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
          <div style="display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #191D25">
            <span class="ch6" style="width:84px;text-align:center;font-size:12px;padding:4px 0;background:#191D25;color:#A3AAB6">{{r.type}}</span>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><b style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.desc}}</b><span style="font-size:12px;color:#7C8494">{{r.date}}</span></div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
              <b style="font-family:'JetBrains Mono',monospace;font-size:15px;color:{{r.color}}">{{r.amount}}</b>
              <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#7C8494">잔액 {{r.after}}</span>
            </div>
          </div>
        </sc-for>
      </div></div>
      <span style="font-size:12px;color:#7C8494">기록은 지워지지 않아요. 유료 클러치는 방송별로 묶어서 보여줘요.</span>
    </main>

    <aside style="flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:10px">
      <span style="font-size:13px;color:#A3AAB6">충전 창</span>
      <div role="dialog" aria-label="비트 충전" class="ch12" style="background:rgba(176,246,18,.25);padding:1px"><div class="ch12" style="background:#12151B;padding:22px;display:flex;flex-direction:column;gap:14px">
        <b style="font-size:18px">비트 충전</b>
        <div role="radiogroup" aria-label="충전 금액" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
          <button type="button" role="radio" aria-checked="false" class="ch6" style="height:52px;border:0;background:#191D25;color:#F3F5F7;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px">1,000</button>
          <button type="button" role="radio" aria-checked="false" class="ch6" style="height:52px;border:0;background:#191D25;color:#F3F5F7;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px">5,000</button>
          <button type="button" role="radio" aria-checked="true" class="ch6" style="height:52px;border:0;background:#B0F612;color:#0A0C0F;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px">10,000</button>
          <button type="button" role="radio" aria-checked="false" class="ch6" style="height:52px;border:0;background:#191D25;color:#F3F5F7;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px">50,000</button>
        </div>
        <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A3AAB6">직접 입력 (1,000 ~ 1,000,000)<input type="text" inputmode="numeric" placeholder="비트" class="ch6" style="height:46px;border:0;background:#191D25;color:#F3F5F7;padding:0 12px;font-family:'JetBrains Mono',monospace;font-size:15px"></label>
        <div style="display:flex;justify-content:space-between;font-size:14px"><span style="color:#A3AAB6">결제 금액</span><b style="font-family:'JetBrains Mono',monospace">10,000원</b></div>
        <div style="display:flex;justify-content:space-between;font-size:14px"><span style="color:#A3AAB6">충전 후 잔액</span><b style="font-family:'JetBrains Mono',monospace;color:#B0F612">13,500 Beats</b></div>
        <button type="button" class="ch6" style="height:52px;border:0;background:#B0F612;color:#0A0C0F;font-weight:700;font-size:16px;font-family:'Noto Sans KR',sans-serif">10,000원 결제하기</button>
        <span style="font-size:12px;color:#7C8494;line-height:1.6">토스페이먼츠 테스트 결제예요. 실제로 돈이 나가지 않아요.<br>테스트 모드 충전은 환불을 지원하지 않아요.</span>
      </div></div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var names = ['전체', '충전', '후원', '클러치·버스트', '소멸'];
    var lime = '#B0F612', white = '#F3F5F7';
    return {
      filters: names.map(function (n, i) { return { label: n, on: i === 0 ? 'true' : 'false', bg: i === 0 ? lime : '#191D25', fg: i === 0 ? '#0A0C0F' : '#A3AAB6', w: i === 0 ? 700 : 500 }; }),
      rows: [
        { type: '후원', desc: '김플러 · [대회 준비중] 오늘도 클러치 가보자!', date: '11월 9일 21:42', amount: '-5,000', after: '3,500', color: white },
        { type: '클러치', desc: '김플러 방송 클러치 ×37', date: '11월 9일 21:10 ~ 21:40', amount: '-37', after: '8,500', color: white },
        { type: 'SUPER BURST', desc: '버추얼_릴리 · 신규 3D 모델 첫 공개', date: '11월 9일 20:15', amount: '-1,000', after: '8,537', color: white },
        { type: '충전', desc: '토스페이먼츠 테스트 결제', date: '11월 9일 20:12', amount: '+5,000', after: '9,537', color: lime },
        { type: '충전·후원', desc: '충전하고 후원하기 · 박클러치', date: '11월 8일 23:02', amount: '+3,000 / -3,000', after: '4,537', color: lime },
        { type: '후원', desc: '삭제된 방송', date: '11월 7일 19:30', amount: '-2,000', after: '4,537', color: white },
        { type: '충전', desc: '토스페이먼츠 테스트 결제', date: '11월 7일 19:28', amount: '+6,537', after: '6,537', color: lime }
      ]
    };
  }
}
</script>
</body>
</html>
