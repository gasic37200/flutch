name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flutch
          POSTGRES_PASSWORD: flutch
          POSTGRES_DB: flutch
          TZ: UTC
          PGTZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flutch"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://flutch:flutch@localhost:5432/flutch_ci
      SQLX_OFFLINE: "true"
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Install sqlx-cli
        run: command -v sqlx || cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls --locked
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Migrate and check .sqlx is up to date
        env:
          SQLX_OFFLINE: "false"
        run: |
          sqlx database create
          sqlx migrate run
          cargo sqlx prepare --check
      - run: cargo test
      - name: ts-rs bindings match committed files
        working-directory: .
        run: |
          git status --porcelain frontend/src/api/generated
          test -z "$(git status --porcelain frontend/src/api/generated)" || { echo "::error::cargo test 후 frontend/src/api/generated를 커밋하세요"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
