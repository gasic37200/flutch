# 로컬 개발용: Postgres + 로컬 LiveKit. 저장소 루트에서
#   docker compose --env-file .env -f deploy/compose.dev.yml up -d
# 모든 worktree가 이 컨테이너 하나를 같이 쓴다(DB는 worktree마다 이름만 다르게).
name: flutch-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flutch
      POSTGRES_PASSWORD: flutch
      POSTGRES_DB: flutch
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flutch"]
      interval: 2s
      timeout: 3s
      retries: 15

  livekit:
    image: livekit/livekit-server:v1.13
    # --dev: API 키 devkey / 시크릿 secret
    command: --dev --bind 0.0.0.0
    environment:
      LIVEKIT_CONFIG: |
        webhook:
          api_key: devkey
          urls:
            - http://host.docker.internal:${BACKEND_PORT:-8080}/api/v1/livekit/webhook
        rtc:
          node_ip: 127.0.0.1
    # WSL에서 띄운 백엔드로 웹훅이 닿게 한다(docs/troubleshooting/T01-livekit-webhook-wsl.md).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pgdata:
