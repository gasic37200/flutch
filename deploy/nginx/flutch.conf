map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name flutch.kro.kr;

    # certbot HTTP-01 챌린지(webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name flutch.kro.kr;

    ssl_certificate     /etc/letsencrypt/live/flutch.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flutch.kro.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    client_max_body_size 2m; # 썸네일 정도만
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    # 요청 제한용 클라이언트 IP. 클라이언트가 보낸 값을 이어붙이지 않고 덮어쓴다(위조 방지).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 백엔드 메트릭은 외부 비공개(Prometheus는 도커 네트워크에서 직접 수집)
    location = /metrics {
        return 404;
    }

    # 모니터링 Grafana(하위 경로, 로그인 필수). 변수+resolver라 grafana가 없어도 web은 뜬다.
    # location 안에서 proxy_set_header를 하나라도 쓰면 server 수준 설정이 상속되지 않아 전부 다시 적는다.
    location /grafana/ {
        resolver 127.0.0.11 valid=10s;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # REST + WebSocket(/api/v1/broadcasts/{id}/events)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # location에서 proxy_set_header를 쓰면 server 수준 값이 상속되지 않는다 — 요청 제한 IP(XFF)가 빠지지 않게 다시 적는다.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h; # WebSocket 유휴 연결 유지
    }

    # 썸네일: backend가 볼륨에 쓴다. URL에 ?v=<갱신시각>이 붙어 갱신되면 URL이 바뀌므로 오래 캐시해도 된다.
    location /media/thumbs/ {
        alias /var/www/thumbs/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        default_type image/jpeg;
    }

    # 해시가 붙은 정적 파일은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA history fallback
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }
}
