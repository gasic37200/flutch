# 운영(Oracle ARM 서버). 서버의 ~/flutch/ 에서 실행한다. .env는 서버에만 있다(.env.example 참고).
# 모니터링(Prometheus·Loki·Grafana·Alloy)은 T13, 썸네일 볼륨(thumbs)은 backend가 쓰고 web(nginx)이 읽는다.
name: flutch

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: flutch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD 필요}
      POSTGRES_DB: flutch
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flutch"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging: *logging

  backend:
    image: ghcr.io/gasic37200/flutch-backend:${FLUTCH_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 15s # WebSocket이 열려 있으면 graceful 종료가 늦어진다
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      BACKEND_PORT: "8080"
      DATABASE_URL: postgres://flutch:${POSTGRES_PASSWORD}@postgres:5432/flutch
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?}
      LIVEKIT_URL: ${LIVEKIT_URL:?}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - thumbs:/thumbs # THUMB_DIR(backend/Dockerfile 기본값)
    logging: *logging

  web:
    image: ghcr.io/gasic37200/flutch-web:${FLUTCH_TAG:-latest}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - thumbs:/var/www/thumbs:ro
    logging: *logging

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    logging: *logging

  # 최초 인증서 발급 전용(deploy/init-cert.sh). web 이미지가 인증서 없이는 뜨지 못하므로 임시 80번 서버를 쓴다.
  acme-http:
    image: nginx:1.27-alpine
    profiles: ["init"]
    ports:
      - "80:80"
    volumes:
      - certbot-www:/usr/share/nginx/html

  # --- 모니터링(T13): 외부 포트 없음, Grafana만 web(nginx)의 /grafana/ 로 노출. 메모리 상한은 18GB 서버 기준 보수적으로 ---
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    logging: *logging

  loki:
    image: grafana/loki:3.5.5
    restart: unless-stopped
    mem_limit: 512m
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    logging: *logging

  alloy:
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    mem_limit: 256m
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on: [loki]
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # 컨테이너 로그 수집. :ro여도 Docker API 전체 접근이 가능하다 — 이 소켓은 Alloy에만 연결한다
      - alloy-data:/var/lib/alloy/data
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    mem_limit: 64m
    pid: host
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    mem_limit: 384m
    depends_on: [prometheus, loki]
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://flutch.kro.kr/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?.env에 GRAFANA_ADMIN_PASSWORD 필요}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false" # 알림 없음(features/10)
      GF_ALERTING_ENABLED: "false"
      TZ: Asia/Seoul
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    logging: *logging


volumes:
  pgdata:
  letsencrypt:
  certbot-www:
  thumbs:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
